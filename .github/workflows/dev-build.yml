name: Dev Build

# ─────────────────────────────────────────────────────────────────────────
# 내부 배포용 개발 빌드. `dev` 브랜치에 push되면 자동으로 돈다.
#
# `eas build`는 쓰지 않는다 — ci.yml의 android-release/ios-release와 같은
# 자체 self-hosted 파이프라인(prebuild → gradlew / xcodebuild)으로 만든다.
# EAS는 OTA(EAS Update, ci.yml의 ota-publish) 경로에만 쓴다.
#
# 개발 변형(APP_VARIANT=development, app.config.js 참고)은 운영 앱과 별도로
# 설치된다 — bundle id/package, 아이콘, Firebase 설정, associated domain
# (딥링크), URL scheme이 모두 다르다. 그래서 운영 릴리스와 달리 스토어/
# TestFlight에 올리지 않는다. 배포는 두 갈래다:
#   1. Actions 아티팩트 (보존 14일, GitHub 로그인 필요)
#   2. Garage(S3 호환) → https://media.inuappcenter.kr/intip-app-artifacts/dev/
#      로그인 없이 링크 하나로 받는다. iOS는 itms-services 무선 설치까지
#      되고, 그 설치 페이지를 publish-install-page 잡이 만든다.
#
# 러너: ci.yml과 동일한 이유로 self-hosted(gangbook-air, macOS ARM64) 하나를
# 공유한다 — private 저장소라 GitHub-hosted, 특히 macOS는 분당 과금이 크다.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [dev]

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 검증 (lint · 타입체크 · 테스트)
    runs-on: self-hosted
    steps:
      - name: Checkout (with intip-bridge submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

  android-dev-build:
    name: Android 개발 빌드 (APK)
    needs: verify
    runs-on: self-hosted
    env:
      APP_VARIANT: development
      # 네이티브 config(app.config.js, APP_VARIANT 기준)와 별개로 JS 번들에도
      # 박아 넣는다 — src/webview/constants.ts 참고. 이 잡은 Release 설정으로
      # 빌드하므로 .env.production만으로는 운영 빌드와 구분이 안 된다.
      EXPO_PUBLIC_ROOT_URL: https://6c90707e.intip-test.pages.dev
    steps:
      - name: Checkout (with intip-bridge submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # withAndroidReleaseSigning은 패키지명과 무관하게 동작하므로, 운영
      # 릴리스 키스토어를 그대로 재사용한다 — package가 다르니 Play
      # Store와는 충돌하지 않는다(어차피 Play Store에 올리지 않는다).
      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > intip.jks

      # app.config.js가 APP_VARIANT=development일 때 android.googleServicesFile을
      # 이 경로로 바꿔 가리킨다. dev 패키지명(inu.appcenter.intip_android.dev)에
      # 등록된 별도 Firebase 앱 설정이어야 한다.
      - name: Decode google-services-dev.json
        run: echo "${{ secrets.GOOGLE_SERVICES_DEV_JSON_BASE64 }}" | base64 --decode > google-services-dev.json

      # 포털 URL은 잡 env가 아니라 .env.local 파일로 넘긴다. env만으로는
      # 안 되는 게 실측으로 확인됐다(run 34024945756): 잡 env에는 분명히
      # EXPO_PUBLIC_ROOT_URL이 있었는데도 나온 IPA의 main.jsbundle에는
      # intip-test.pages.dev가 0회, intip.inuappcenter.kr이 1회 들어 있었다 —
      # constants.ts의 process.env.EXPO_PUBLIC_ROOT_URL이 인라인되지 않고
      # 폴백이 그대로 박힌 것이다. JS 번들링은 prebuild가 아니라 gradle /
      # Xcode 스크립트 페이즈가 띄우는 하위 프로세스(expo export:embed)에서
      # 도는데, 거기까지 잡 env가 전달되지 않는다. Expo CLI는 프로젝트 루트의
      # .env.local을 언제나 읽으므로(우선순위도 .env.production보다 높다) 이
      # 경로는 누가 번들러를 띄우든 무관하게 동작한다.
      #
      # 이 파일은 .gitignore(.env*.local) 대상이고, 같은 러너를 쓰는 ci.yml의
      # 운영 릴리스에 새어 들어가면 운영 앱이 테스트 포털을 보게 되므로
      # 아래 정리 스텝에서 반드시 지운다.
      - name: Write .env.local (포털 URL)
        run: echo "EXPO_PUBLIC_ROOT_URL=${EXPO_PUBLIC_ROOT_URL}" > .env.local

      - name: Prebuild (android)
        run: npx expo prebuild --clean --platform android

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC"
        run: ./gradlew --no-daemon --build-cache assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      # 팀 배포용. Actions 아티팩트는 GitHub 로그인이 있어야 받을 수 있어서,
      # 링크 하나로 끝나도록 Garage(media.inuappcenter.kr)에도 올린다.
      - name: Upload APK to Garage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_S3_SECRET_ACCESS_KEY }}
        run: |
          ./scripts/garage-put.sh \
            android/app/build/outputs/apk/release/app-release.apk \
            "dev/${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}/INTIP-dev.apk"

      - name: Remove decoded secrets
        if: always()
        run: rm -f intip.jks google-services-dev.json .env.local

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: intip-dev-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  ios-dev-build:
    name: iOS 개발 빌드 (IPA, ad-hoc)
    needs: verify
    runs-on: self-hosted
    env:
      APP_VARIANT: development
      # 네이티브 config(app.config.js, APP_VARIANT 기준)와 별개로 JS 번들에도
      # 박아 넣는다 — src/webview/constants.ts 참고. 이 잡은 Release 설정으로
      # 빌드하므로 .env.production만으로는 운영 빌드와 구분이 안 된다.
      EXPO_PUBLIC_ROOT_URL: https://6c90707e.intip-test.pages.dev
    steps:
      - name: Checkout (with intip-bridge submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Xcode 버전 확인
        run: xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Decode GoogleService-Info-Dev.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_DEV_PLIST_BASE64 }}" | base64 --decode -o GoogleService-Info-Dev.plist

      # 운영 릴리스와 같은 distribution 인증서를 재사용한다(계정 단위이지
      # bundle id에 묶이지 않는다) — 프로비저닝 프로파일만
      # kr.inuappcenter.intip.dev용 Ad Hoc 프로파일로 다르다.
      - name: Import signing credentials
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_DEV_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_DEV_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/ios_distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-ci.keychain-db"

          echo -n "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security list-keychains -d user | sed 's/"//g' | xargs > "$RUNNER_TEMP/keychains.before"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(cat "$RUNNER_TEMP/keychains.before")
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"

          PROFILE_PATH="$RUNNER_TEMP/INTIP-Dev.mobileprovision"
          echo -n "$IOS_DEV_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/INTIP-Dev.mobileprovision

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/INTIP-Dev.mobileprovision.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/INTIP-Dev.mobileprovision.plist")
          if [ -z "$PROFILE_NAME" ]; then
            echo "::error::INTIP-Dev.mobileprovision 에서 Name을 못 읽었다 — IOS_DEV_PROVISIONING_PROFILE_BASE64 확인 필요"
            exit 1
          fi
          echo "IOS_PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      # withIOSManualSigning은 IOS_PROVISIONING_PROFILE_NAME이 세팅된 채로
      # prebuild가 돌 때만 활성화된다 — 위 스텝에서 이미 넣었으므로 그대로
      # 재사용한다(운영 릴리스 잡과 동일한 플러그인).
      # 포털 URL은 잡 env가 아니라 .env.local 파일로 넘긴다. env만으로는
      # 안 되는 게 실측으로 확인됐다(run 34024945756): 잡 env에는 분명히
      # EXPO_PUBLIC_ROOT_URL이 있었는데도 나온 IPA의 main.jsbundle에는
      # intip-test.pages.dev가 0회, intip.inuappcenter.kr이 1회 들어 있었다 —
      # constants.ts의 process.env.EXPO_PUBLIC_ROOT_URL이 인라인되지 않고
      # 폴백이 그대로 박힌 것이다. JS 번들링은 prebuild가 아니라 gradle /
      # Xcode 스크립트 페이즈가 띄우는 하위 프로세스(expo export:embed)에서
      # 도는데, 거기까지 잡 env가 전달되지 않는다. Expo CLI는 프로젝트 루트의
      # .env.local을 언제나 읽으므로(우선순위도 .env.production보다 높다) 이
      # 경로는 누가 번들러를 띄우든 무관하게 동작한다.
      #
      # 이 파일은 .gitignore(.env*.local) 대상이고, 같은 러너를 쓰는 ci.yml의
      # 운영 릴리스에 새어 들어가면 운영 앱이 테스트 포털을 보게 되므로
      # 아래 정리 스텝에서 반드시 지운다.
      - name: Write .env.local (포털 URL)
        run: echo "EXPO_PUBLIC_ROOT_URL=${EXPO_PUBLIC_ROOT_URL}" > .env.local

      - name: Prebuild (ios)
        run: npx expo prebuild --clean --platform ios

      - name: Archive
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace INTIP.xcworkspace \
            -scheme INTIP \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/INTIP-Dev.xcarchive" \
            -destination "generic/platform=iOS"

      - name: Export IPA (ad-hoc)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>AANGG4Q668</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>iPhone Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>kr.inuappcenter.intip.dev</key>
              <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/INTIP-Dev.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA to Garage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_S3_SECRET_ACCESS_KEY }}
        run: |
          BUILD_DIR="dev/${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          ./scripts/garage-put.sh "$RUNNER_TEMP/export/INTIP.ipa" "$BUILD_DIR/INTIP-dev.ipa"
          # manifest.plist의 display-image/full-size-image용. 없으면 설치
          # 다이얼로그에 아이콘이 안 뜰 뿐이라 실패해도 빌드는 막지 않는다.
          ./scripts/garage-put.sh "assets/icon-dev.icon/Assets/Dev App Icon.png" \
            "$BUILD_DIR/icon.png" || echo "::warning::아이콘 업로드 실패 — 설치 페이지는 정상 동작한다"

      - name: Clean up keychain and decoded secrets
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/keychains.before" ]; then
            security list-keychain -d user -s $(cat "$RUNNER_TEMP/keychains.before") || true
          fi
          security delete-keychain "$RUNNER_TEMP/ios-ci.keychain-db" 2>/dev/null || true
          rm -f GoogleService-Info-Dev.plist .env.local
          rm -f "$RUNNER_TEMP/INTIP-Dev.mobileprovision.plist"
          rm -f ~/Library/MobileDevice/"Provisioning Profiles"/INTIP-Dev.mobileprovision

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: intip-dev-ipa
          path: ${{ runner.temp }}/export/INTIP.ipa
          retention-days: 14

  # 두 빌드가 끝난 뒤, 올라간 산출물을 가리키는 설치 페이지를 만든다.
  # 한쪽 플랫폼이 실패해도 나머지 하나로 페이지를 낸다.
  publish-install-page:
    name: 설치 페이지 게시
    if: always() && (needs.android-dev-build.result == 'success' || needs.ios-dev-build.result == 'success')
    needs: [android-dev-build, ios-dev-build]
    runs-on: self-hosted
    outputs:
      install_url: ${{ steps.publish.outputs.install_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate & upload install page
        id: publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_S3_SECRET_ACCESS_KEY }}
          ANDROID_RESULT: ${{ needs.android-dev-build.result }}
          IOS_RESULT: ${{ needs.ios-dev-build.result }}
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILD_DIR="dev/${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          BASE_URL="https://media.inuappcenter.kr/intip-app-artifacts/${BUILD_DIR}"

          # 버전/빌드번호는 app.json이 진실의 출처다(app.config.js도 이걸 편다).
          VERSION=$(node -p "require('./app.json').expo.version")
          BUILD_NO=$(node -p "require('./app.json').expo.ios.buildNumber")

          ARGS=(--out-dir "$RUNNER_TEMP/page" --base-url "$BASE_URL"
                --version "$VERSION" --build "$BUILD_NO" --sha "$SHORT_SHA"
                --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          [ "$IOS_RESULT" = "success" ] && ARGS+=(--ipa INTIP-dev.ipa --icon icon.png)
          [ "$ANDROID_RESULT" = "success" ] && ARGS+=(--apk INTIP-dev.apk)

          ./scripts/make-dev-install-page.sh "${ARGS[@]}"

          ./scripts/garage-put.sh "$RUNNER_TEMP/page/index.html" "$BUILD_DIR/index.html"
          if [ -f "$RUNNER_TEMP/page/manifest.plist" ]; then
            ./scripts/garage-put.sh "$RUNNER_TEMP/page/manifest.plist" "$BUILD_DIR/manifest.plist"
          fi
          # 페이지 안의 링크가 전부 절대 URL이라, 같은 파일을 dev/index.html로
          # 한 번 더 올리면 "항상 최신 빌드" 주소가 된다.
          ./scripts/garage-put.sh "$RUNNER_TEMP/page/index.html" "dev/index.html"

          echo "install_url=${BASE_URL}/" >> "$GITHUB_OUTPUT"
          echo "### 📲 설치 페이지: ${BASE_URL}/" >> "$GITHUB_STEP_SUMMARY"

  notify-mattermost:
    name: Mattermost 알림
    if: always()
    needs: [verify, android-dev-build, ios-dev-build, publish-install-page]
    runs-on: self-hosted
    steps:
      - name: Send Mattermost notification
        env:
          MATTERMOST_WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          ANDROID_RESULT: ${{ needs.android-dev-build.result }}
          IOS_RESULT: ${{ needs.ios-dev-build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INSTALL_URL: ${{ needs.publish-install-page.outputs.install_url }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$MATTERMOST_WEBHOOK" ]; then
            echo "MATTERMOST_WEBHOOK secret is not set. Skipping Mattermost notification."
            exit 0
          fi

          map_status() {
            case "$1" in
              "success") echo "✅ 성공" ;;
              "failure") echo "❌ 실패" ;;
              "cancelled") echo "⚠️ 취소됨" ;;
              "skipped") echo "⏭️ 건너뜀" ;;
              *) echo "❓ 알 수 없음 ($1)" ;;
            esac
          }

          COLOR="#2ECC71"
          TITLE_EMOJI="🧪"
          TITLE_TEXT="개발 빌드 완료"
          if [ "$ANDROID_RESULT" = "failure" ] || [ "$IOS_RESULT" = "failure" ] || [ "$VERIFY_RESULT" = "failure" ]; then
            COLOR="#E74C3C"
            TITLE_EMOJI="❌"
            TITLE_TEXT="개발 빌드 실패"
          fi

          CLEAN_COMMIT_MSG=$(echo "$COMMIT_MSG" | head -n 1 | sed 's/"/\\"/g')

          # 설치 페이지가 떴으면 그 링크를, 아니면 Actions 아티팩트로 안내한다.
          if [ -n "${INSTALL_URL:-}" ]; then
            INSTALL_LINE="[👉 설치 페이지 열기 (iOS 무선 설치 · Android APK)](${INSTALL_URL})"
          else
            INSTALL_LINE="[👉 GitHub Actions 실행 페이지에서 APK/IPA 다운로드하기](${RUN_URL}#artifacts)"
          fi

          PAYLOAD=$(cat <<EOF
          {
            "attachments": [
              {
                "fallback": "${TITLE_EMOJI} ${TITLE_TEXT}",
                "color": "${COLOR}",
                "title": "${TITLE_EMOJI} ${TITLE_TEXT}",
                "title_link": "${RUN_URL}",
                "fields": [
                  {"title": "🔍 검증", "value": "$(map_status "$VERIFY_RESULT")", "short": true},
                  {"title": "🤖 Android (APK)", "value": "$(map_status "$ANDROID_RESULT")", "short": true},
                  {"title": "🍎 iOS (IPA, ad-hoc)", "value": "$(map_status "$IOS_RESULT")", "short": true},
                  {"title": "👤 실행자", "value": "${ACTOR}", "short": true},
