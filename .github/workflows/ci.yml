name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Native release build to run (none = OTA only)
        required: true
        type: choice
        options: [none, android, ios, both]
        default: none
      publish_ota:
        description: Publish an EAS Update to the production channel
        required: false
        type: boolean
        default: true
      force_ota:
        description: Publish even if native-affecting files changed (see ota-publish guard)
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with intip-bridge submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Falls back to the default GITHUB_TOKEN, which only works once
          # inu-appcenter/intip-bridge grants this repo Actions access
          # (Settings > Actions > General > Access on the intip-bridge repo).
          # Until that's set up, add a SUBMODULE_TOKEN repo secret (PAT with
          # read access to both repos) and it'll be used instead.
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

  ota-publish:
    # OTA first: every merge to main ships as an EAS Update, so a JS-only fix
    # reaches users without a store round-trip. Native release builds stay
    # manual (workflow_dispatch) and are only needed when something *native*
    # changed — which is exactly what the guard below refuses to OTA past.
    #
    # Channel/runtime pairing (see 6f781b4): this repo does not use `eas build`,
    # so app.json pins the channel header to "production" and resolves
    # runtimeVersion from `expo.version` via the appVersion policy. An update
    # therefore only ever reaches installed binaries built from the *same*
    # app.json version — bump `version` and an update stops reaching anyone
    # until a native release ships that version.
    # `needs: verify` already gates this on a green lint/typecheck/test run —
    # a failing job skips its dependents regardless of this condition.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_ota)
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.native_guard.outputs.changed }}
    steps:
      - name: Checkout (with intip-bridge submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
          # Full history: the guard below diffs the range this push brought in.
          fetch-depth: 0

      # An OTA can only carry JS/assets. If a change needs new native code —
      # a config plugin, an app.json native key, a dependency with a native
      # module — then publishing it to binaries that don't have that code is
      # how you brick an installed app (the JS calls a module that isn't there,
      # on every launch, with no way back except a store release).
      #
      # `app.json` also covers the version bump case: bumping `expo.version`
      # moves runtimeVersion, so the update would silently reach nobody.
      #
      # This is a per-push diff, so it catches the change at the moment it
      # lands. If you need something sharper later, `npx expo-updates
      # fingerprint:generate` hashes the real native inputs — it needs the
      # gitignored google-services.json / GoogleService-Info.plist decoded
      # first, or the hash won't match what the release builds produced.
      - name: Guard against native-affecting changes
        id: native_guard
        env:
          FORCED: ${{ github.event_name == 'workflow_dispatch' && inputs.force_ota }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$FORCED" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ force_ota — native-change guard bypassed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # On a push, diff everything the push brought onto main. On a manual
          # dispatch (or a first/force push with no usable `before`), fall back
          # to the last commit.
          if [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            BASE="$(git rev-parse HEAD~1)"
          fi

          CHANGED=$(git diff --name-only "$BASE" "$GITHUB_SHA" -- app.json plugins package.json)

          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## ⏭️ OTA 발행 건너뜀"
              echo
              echo "네이티브 빌드에 영향을 주는 파일이 \`$BASE\`..\`$GITHUB_SHA\` 범위에서 변경됐습니다:"
              echo
              echo '```'
              echo "$CHANGED"
              echo '```'
              echo
              echo "JS 변경만이라면 **Run workflow → force_ota** 로 다시 발행하세요."
              echo "네이티브 변경이라면 \`app.json\`의 \`version\`을 올리고 네이티브 릴리스 빌드를 돌려야 합니다."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.native_guard.outputs.changed != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.native_guard.outputs.changed != 'true'
        run: npm ci

      # app.json points `googleServicesFile` at these on both platforms and
      # they're gitignored, so the app config can't resolve without them.
      # Removed again below, same as the release jobs do.
      - name: Decode Firebase config files
        if: steps.native_guard.outputs.changed != 'true'
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > google-services.json
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > GoogleService-Info.plist

      # eas-cli reads EXPO_TOKEN directly, so no interactive login is needed.
      # Create one at https://expo.dev/settings/access-tokens (the account must
      # own gang_03/intip-mobile-app) and add it as the EXPO_TOKEN repo secret.
      - name: Publish EAS Update
        if: steps.native_guard.outputs.changed != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN secret is not set — cannot publish an EAS Update."
            exit 1
          fi

          RUNTIME_VERSION=$(node -p "require('./app.json').expo.version")
          MESSAGE=$(git log -1 --pretty=%s | cut -c1-100)

          # `eas update` creates the *branch* but never the *channel*, and a
          # channel is what the installed app actually asks for (app.json pins
          # the expo-channel-name header to "production"). Publishing to a
          # branch no channel points at succeeds and reaches nobody — so make
          # sure the channel exists first. Idempotent: create only if absent.
          if ! npx eas-cli@latest channel:view production --non-interactive >/dev/null 2>&1; then
            echo "Channel 'production' does not exist — creating it (branch: production)."
            npx eas-cli@latest channel:create production --non-interactive
          fi

          echo "Publishing to channel 'production' (runtimeVersion $RUNTIME_VERSION)"
          npx eas-cli@latest update \
            --branch production \
            --platform all \
            --message "$MESSAGE" \
            --non-interactive

          {
            echo "## 🚀 EAS Update 발행됨"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 채널 | \`production\` |"
            echo "| runtimeVersion | \`$RUNTIME_VERSION\` |"
            echo "| 메세지 | $MESSAGE |"
            echo
            echo "이 업데이트는 \`version\` 이 \`$RUNTIME_VERSION\` 인 설치본에만 도달합니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove decoded secrets
        if: always()
        run: rm -f google-services.json GoogleService-Info.plist

  android-release:
    # Manual only — a signed release build shouldn't fire on every PR/push.
    if: |
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both')
    runs-on: self-hosted
    steps:
      - name: Checkout (with intip-bridge submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # withAndroidReleaseSigning (plugins/withAndroidReleaseSigning.js) wires
      # this file + the env vars below into android/app/build.gradle during
      # prebuild. Decoded fresh every run and removed at the end — never
      # written to a cache or artifact.
      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > intip.jks

      # app.json's android.googleServicesFile points at this — gitignored
      # (like the keystore), so prebuild has nothing to read without it.
      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > google-services.json

      - name: Prebuild (android)
        run: npx expo prebuild --platform android

      - name: Build signed release AAB and APK
        working-directory: android
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC"
        # x86/x86_64 are emulator-only ABIs — skipping them for this release
        # build roughly halves native (reanimated/worklets) compile time with
        # no effect on the real Play Store binary.
        run: ./gradlew --no-daemon --build-cache assembleRelease bundleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Remove decoded secrets
        if: always()
        run: rm -f intip.jks google-services.json

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: intip-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: intip-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  ios-release:
    # Manual only — a signed, uploaded release build shouldn't fire on every
    # PR/push, and macOS runners are far more expensive than Linux ones.
    if: |
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both')
    runs-on: macos-26
    env:
      # Matches the AuthKey_<id>.p8 filename — not itself a secret.
      APP_STORE_CONNECT_KEY_ID: "45D3A26734"
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_PATH: "/Users/runner/.appstoreconnect/private_keys/AuthKey_45D3A26734.p8"
    steps:
      - name: Checkout (with intip-bridge submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # SDK 56 requires a newer Xcode than some macos-26 images default to.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: npm ci

      # app.json's ios.googleServicesFile points at this — gitignored, like
      # android's counterpart.
      - name: Decode GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode -o GoogleService-Info.plist

      - name: Prebuild (ios)
        run: npx expo prebuild --platform ios

      # Everything below builds and signs the archive using a throwaway
      # keychain scoped to this job (created fresh, deleted at the end).
      # The .p12 / provisioning profile / API key are decoded fresh every
      # run and never written to a cache or artifact.
      - name: Import signing credentials
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/ios_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/INTIP.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-ci.keychain-db"

          echo -n "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/INTIP.mobileprovision

      # Decoded here (not just in the upload step) because xcodebuild also
      # needs it below: -allowProvisioningUpdates has it talk to App Store
      # Connect directly to resolve/renew the provisioning profile, instead
      # of us pinning PROVISIONING_PROFILE_SPECIFIER on the command line.
      - name: Decode App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p "$(dirname "$APP_STORE_CONNECT_KEY_PATH")"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$APP_STORE_CONNECT_KEY_PATH"

      # CODE_SIGN_STYLE=Manual + PROVISIONING_PROFILE_SPECIFIER as command-line
      # overrides apply to *every* target in the workspace, not just the app —
      # including CocoaPods' framework/library targets, which can't carry a
      # provisioning profile at all and fail with "does not support
      # provisioning profiles". -allowProvisioningUpdates (automatic signing,
      # authenticated via the API key) only touches the actual app target.
      - name: Archive
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace INTIP.xcworkspace \
            -scheme INTIP \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/INTIP.xcarchive" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM=AANGG4Q668

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>AANGG4Q668</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/INTIP.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/INTIP.ipa" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up keychain and decoded secrets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-ci.keychain-db" 2>/dev/null || true
          rm -f GoogleService-Info.plist
          rm -f "$APP_STORE_CONNECT_KEY_PATH"
          rm -f ~/Library/MobileDevice/"Provisioning Profiles"/INTIP.mobileprovision

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: intip-release-ipa
          path: ${{ runner.temp }}/export/INTIP.ipa
          retention-days: 14

  notify-discord:
    # Manual releases, plus every OTA publish on main (which is now the normal
    # way a change reaches users, so it's worth announcing).
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    needs: [verify, ota-publish, android-release, ios-release]
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          OTA_RESULT: ${{ needs.ota-publish.result }}
          # The guard sets this to "true" when it refused to publish; the job
          # itself still succeeds, so the result alone can't tell them apart.
          OTA_GUARDED: ${{ needs.ota-publish.outputs.skipped }}
          ANDROID_RESULT: ${{ needs.android-release.result }}
          IOS_RESULT: ${{ needs.ios-release.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.sha }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          PLATFORM_INPUT: ${{ inputs.platform || 'none' }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is not set. Skipping Discord notification."
            exit 0
          fi

          map_status() {
            case "$1" in
              "success") echo "✅ 성공" ;;
              "failure") echo "❌ 실패" ;;
              "cancelled") echo "⚠️ 취소됨" ;;
              "skipped") echo "⏭️ 건너뜀" ;;
              *) echo "❓ 알 수 없음 ($1)" ;;
            esac
          }

          ANDROID_STATUS=$(map_status "$ANDROID_RESULT")
          IOS_STATUS=$(map_status "$IOS_RESULT")
          VERIFY_STATUS=$(map_status "$VERIFY_RESULT")

          if [ "$OTA_GUARDED" = "true" ]; then
            OTA_STATUS="⏭️ 건너뜀 (네이티브 변경 감지)"
          else
            OTA_STATUS=$(map_status "$OTA_RESULT")
          fi

          COLOR=3066993
          TITLE_EMOJI="🎉"
          TITLE_TEXT="모바일 앱 배포 파이프라인 완료"

          if [ "$OTA_RESULT" = "failure" ] || [ "$ANDROID_RESULT" = "failure" ] || [ "$IOS_RESULT" = "failure" ] || [ "$VERIFY_RESULT" = "failure" ]; then
            COLOR=15158332
            TITLE_EMOJI="❌"
            TITLE_TEXT="모바일 앱 배포 파이프라인 실패"
          elif [ "$ANDROID_RESULT" = "cancelled" ] || [ "$IOS_RESULT" = "cancelled" ]; then
            COLOR=15105570
            TITLE_EMOJI="⚠️"
            TITLE_TEXT="모바일 앱 배포 중단/취소됨"
          fi

          CLEAN_COMMIT_MSG=$(echo "$COMMIT_MSG" | head -n 1 | sed 's/"/\\"/g')

          PAYLOAD=$(cat <<EOF
          {
            "embeds": [
              {
                "title": "${TITLE_EMOJI} ${TITLE_TEXT}",
                "url": "${RUN_URL}",
                "color": ${COLOR},
                "fields": [
                  {
                    "name": "📡 OTA (EAS Update / production)",
                    "value": "${OTA_STATUS}",
                    "inline": true
                  },
                  {
                    "name": "🤖 Android (APK & AAB)",
                    "value": "${ANDROID_STATUS}",
                    "inline": true
                  },
                  {
                    "name": "🍎 iOS (IPA / TestFlight)",
                    "value": "${IOS_STATUS}",
                    "inline": true
                  },
                  {
                    "name": "🔍 사전 검증 (Verify)",
                    "value": "${VERIFY_STATUS}",
                    "inline": true
                  },
                  {
                    "name": "📌 요청 플랫폼",
                    "value": "${PLATFORM_INPUT}",
                    "inline": true
                  },
                  {
                    "name": "🌿 브랜치",
                    "value": "${REF_NAME}",
                    "inline": true
                  },
                  {
                    "name": "👤 실행자",
                    "value": "${ACTOR}",
                    "inline": true
                  },
                  {
                    "name": "💬 커밋 메세지",
                    "value": "${CLEAN_COMMIT_MSG}"
                  },
                  {
                    "name": "📦 빌드 결과물 및 아티팩트 다운로드",
                    "value": "[👉 GitHub Actions 실행 페이지에서 AAB/IPA 다운로드하기](${RUN_URL}#artifacts)"
                  }
                ],
                "footer": {
                  "text": "INTIP Mobile Deployment Pipeline"
                },
                "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
              }
            ]
          }
          EOF
          )

          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"

