name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with intip-bridge submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Falls back to the default GITHUB_TOKEN, which only works once
          # inu-appcenter/intip-bridge grants this repo Actions access
          # (Settings > Actions > General > Access on the intip-bridge repo).
          # Until that's set up, add a SUBMODULE_TOKEN repo secret (PAT with
          # read access to both repos) and it'll be used instead.
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci
